services:
  jekyll-site:
    image: jekyll-site
    build: .
    volumes: [ .:/usr/src/app ]
    ports: [ 4000:4000 ]
    user: 1000:1000
    environment: [ JEKYLL_ENV=docker ]
    # --force_polling: file-change events from a Windows host don't reach the container, so poll for edits instead
    command: jekyll serve -H 0.0.0.0 -w --force_polling --config _config.yml,_config_docker.yml
